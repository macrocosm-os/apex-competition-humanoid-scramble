schema: apex.competition.v1
id: box_scramble
version: 0.1.2
display_name: "Box Scramble"
kind: solo
process_type: cpu

# Fork of Humanoid Parkour (macrocosm-os/apex-competition-humanoid-parkour). Same robot family,
# same gym_v1 protocol, same resource profile to start with -- the fork changes the OBSTACLE (a
# per-round-sampled field of 196 loose boxes in a 48 m x 6 m room) rather than the runtime
# contract, so the upstream competition's own measured resource numbers are the right starting
# prior. Re-measure before onboarding rather than trusting this note (HANDOFF SS4 requires it):
# box free-body physics is more expensive per step than parkour's static geometry (196 free
# bodies, many in contact), and this spec has not yet been profiled under its own limits the way
# upstream's was.
resources:
  cpu_limit: 2
  mem_limit: 1.5Gi
  gpu_count: 0

# Built, pushed, and keyless-cosign-signed by this repo's release workflow (see
# .github/workflows/release.yml). `image` is the PLAYER image (loads + serves the miner's ONNX
# policy).
#
# NOTE (v0.1.2): the digests below are still v0.1.1's at tag time, carried forward deliberately --
# `apex-dev preflight` gates the release job and needs digests that already parse, and the real
# ones only exist after the tag's run. Pinned in a follow-up commit; do not register or activate
# 0.1.2 until that has landed.
#
# Pinned from the v0.1.1 release run (Actions run 34185209165, all four jobs green). Both digests
# were cosign-verified before being written here: signature present, issuer the GitHub OIDC
# endpoint, and the certificate SAN reading
# `.../release.yml@refs/tags/v0.1.1` -- which matches this file's `cosign_identity` glob -- with
# githubWorkflowSha 7928934 = v0.1.1^{commit}, so the images carry the tagged tree rather than a
# stale one. The platform pins by digest and rejects tags.
#
# 0.1.2 acts on the PR-env load test (apex-mvp#452): `time_limit` is now scored on the progress
# the run made rather than zeroed, history records the robot plus only the boxes that moved
# (~119 MB -> ~20 MB per submission), and the round input is re-sized to something that fits its
# own budget. See the release notes; the round input lives in the competition row, not here.
#
# 0.1.1 is the first version that can score at all. 0.1.0's PD loop drove all 22 actuators from
# the wrong joint's state (data.ctrl is in actuator order, qpos/qvel in body-tree order, and
# g1_22dof.xml declares the arm chain before the legs), so the robot left the physical regime
# within ~5 control steps; and 29-31 of its 196 boxes spawned interpenetrating by up to 0.58 m.
# Both are fixed here and both are now gated in release CI. Do not activate 0.1.0 anywhere.
image:
  ref: ghcr.io/macrocosm-os/apex-competition-humanoid-scramble-player
  digest: sha256:9ad869866258e0d80d6b005c39a832427e2ee66a4cec715a3d782bd6efefe31d

# ONNX artifact: the miner submits a policy graph, not code. The player image validates the
# interface at load time -- obs [batch,136] + state_in [batch,256] -> action [batch,22] +
# state_out [batch,256], all float32 -- so there is no code to screen and no Layer-2 screen image.
#
# The signature is NOT upstream parkour's. This robot has full arm control (22 actuated DoF, 12
# legs + 10 arms) because pushing, lifting and climbing are the task, where parkour's was
# legs-only at 12 DoF; the observation grew with it (136, adding the hand-proximity rays). A
# submission built for upstream, or for this course before 2026-08-18, fails the shape check and
# is rejected as a typed submission failure rather than silently truncated. See env/sim.py's
# module docstring for the full layout.
#
# The architecture itself is NOT constrained; only the tensor signature is.
submission:
  artifact_type: onnx
  max_size_mb: 15
  target_path: /app/submission.onnx

screening:            # Layer-1 generic weights validator (onnx artifact_type)
  max_size_mb: 15
  min_weight_bytes: 10000        # rejects near-empty graphs / constant policies
  max_code_weight_ratio: 0.1     # ignored for onnx -- a graph carries no code

input_schema:
  $ref: ./input.schema.json

defaults:
  baseline_score: 0.0
  # 0.0 by choice, same reasoning as upstream parkour: this is the platform's ENTRY BAR
  # (score_to_beat = max(this, top_raw) * 1.01) and must not sit above the true measured
  # baseline or the round stalls forever. Replace with the measured baseline/PROVENANCE.md
  # number before onboarding (HANDOFF.md SS2/SS4) -- unmeasured here because the baseline for
  # THIS course (box contact dynamics, not parkour's fixed geometry) has not been run yet.
  baseline_raw_score: 0.0
  round_length_in_days: 2
  submission_reveal_days: 5      # trained policies carry real R&D; protect them, same as upstream
  lower_is_better: false

entrypoints:
  # The PLAYER sandbox: serves the ONNX policy over gym_v1; the referee drives it one
  # observation at a time. timeout_s inherited from upstream parkour's measured worst case
  # (24 instances x <=3000 steps, ~750 s) as a starting point -- RE-MEASURE before onboarding:
  # box contact resolution (196 free bodies vs. parkour's static geometry) costs more per physics
  # step than parkour's baseline did, which may require cutting num_instances /
  # max_steps_per_episode in the round input rather than raising these timeouts.
  #
  # Deliberately LONGER than referee.timeout_s (900): the player's clock starts earlier (image
  # start + readiness polling) and it must outlive the referee. If the player is killed first,
  # the referee's remaining instances score player_error -- a zero the submission did not earn.
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false   # the referee must reach the player on the per-job network
    allow_internet: false
    timeout_s: 1200
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

# The scorer sandbox: MuJoCo physics, the G1 model, the room + box field, termination gates,
# scoring. No generate_round entrypoint: the suite is a pure function of the round input, same as
# upstream (env/course.sample_boxes derives the whole box field from the injected SEED).
referee:
  protocol: gym_v1
  image:
    ref: ghcr.io/macrocosm-os/apex-competition-humanoid-scramble-referee
    digest: sha256:ecdc6d24b9f1eb4d2fe27518bee45bd3ac43f379ac55e654c824fbc40522f563
  # RE-MEASURE before onboarding (see entrypoints.evaluate.timeout_s above). This is a hard kill
  # with no grace: nothing is written and the round has no result, which the platform attributes
  # to the referee. The referee therefore runs the suite to its OWN wall-clock budget --
  # time_budget_s in the round input, default 780 -- so the kill is not what bounds the
  # evaluation. Keep that budget comfortably below this number if either moves.
  timeout_s: 900

signature:
  # The `@refs/tags/*` suffix is REQUIRED, not decoration. A GitHub keyless signature's Fulcio
  # certificate carries the SAN `<workflow path>@<ref>`, and the registry syncer anchors a
  # glob-free identity as an exact-match regexp -- so a bare path can never match and the spec is
  # silently skipped on every sync pass. Upstream parkour hit exactly this.
  #
  # The repo is `apex-competition-humanoid-scramble` (the earlier `apex-competition-box-scramble`
  # here was aspirational and never existed). A Fulcio SAN is built from the repository at signing
  # time, so this must name the repo the release workflow actually runs in, or no signature will
  # ever match.
  cosign_identity: https://github.com/macrocosm-os/apex-competition-humanoid-scramble/.github/workflows/release.yml@refs/tags/*
  cosign_issuer: https://token.actions.githubusercontent.com
